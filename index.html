<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB PROP OPTIMIZER • NineToFiveSports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        .tab-active { border-bottom: 3px solid #00d4ff; color: #00d4ff; }
        th { cursor: pointer; user-select: none; }
        th:hover { background-color: #1e2937; }
        th .sort-icon { opacity: 0.35; font-size: 10px; margin-left: 4px; }
        th.sorted .sort-icon { opacity: 1; color: #00d4ff; }
        .bookmaker-logo { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }
        .player-image { width: 72px; height: 72px; object-fit: cover; border-radius: 9999px; border: 2px solid #334155; }
        .detail-tab { padding: 8px 20px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.2s; }
        .detail-tab.active { border-bottom-color: #00d4ff; color: #00d4ff; }
        .game-log-table th, .game-log-table td { padding: 8px 10px; font-size: 12px; text-align: center; }
        .game-log-table th { background: #1e2937; color: #94a3b8; position: sticky; top: 0; }
        .splits-chart-container { max-height: 260px; }
        .best-bets-active { background: #059669 !important; color: white !important; border-color: #059669 !important; }
        .verdict-strong { background: #065f46; color: #6ee7b7; }
        .verdict-decent { background: #1e3a5f; color: #93c5fd; }
        .verdict-weak { background: #44403c; color: #fcd34d; }
        .verdict-avoid { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-7xl mx-auto p-6">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div class="flex items-center gap-x-4">
                <div class="text-5xl">⚾</div>
                <h1 class="header-font text-5xl font-semibold tracking-tighter">MLB PROP OPTIMIZER</h1>
            </div>
            <div class="text-emerald-400 font-medium">NineToFiveSports</div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="flex-1">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search player, team, market, or game..."
                           oninput="renderCurrentTab()"
                           class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-5 py-3 text-sm pl-12 focus:outline-none focus:border-emerald-400">
                    <i class="fa-solid fa-search absolute left-5 top-4 text-slate-400"></i>
                </div>
            </div>
            <button onclick="loadProps()"
                    class="px-8 py-3 bg-emerald-400 text-slate-950 rounded-3xl font-semibold flex items-center gap-x-3 hover:bg-emerald-300 transition-colors whitespace-nowrap">
                <i class="fa-solid fa-rotate"></i>
                <span>REFRESH</span>
            </button>
        </div>

        <div id="status" class="mb-6 p-4 bg-slate-900 rounded-3xl text-sm font-medium"></div>

        <!-- Filters -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-4">
            <div>
                <label class="text-xs text-slate-400 block mb-1">MARKET</label>
                <select id="marketFilter" onchange="renderCurrentTab()" class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-5 py-3 text-sm">
                    <option value="">All Markets</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">GAME</label>
                <select id="gameFilter" onchange="renderCurrentTab()" class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-5 py-3 text-sm">
                    <option value="">All Games</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">BOOKMAKER</label>
                <select id="bookFilter" onchange="renderCurrentTab()" class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-5 py-3 text-sm">
                    <option value="">All Books</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">MATCH PROGRESS</label>
                <select id="matchProgressFilter" onchange="renderCurrentTab()" class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-5 py-3 text-sm">
                    <option value="">All Progress</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">MIN EV EDGE</label>
                <select id="minEdgeFilter" onchange="renderCurrentTab()" class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-5 py-3 text-sm">
                    <option value="0" selected>All (0%+)</option>
                    <option value="3">+3% or better</option>
                    <option value="5">+5% or better</option>
                    <option value="8">+8% or better</option>
                    <option value="10">+10% or better</option>
                </select>
            </div>
        </div>

        <!-- Checkboxes + Best Bets -->
        <div class="flex flex-wrap items-center gap-6 mb-6">
            <div class="flex items-center gap-3">
                <input type="checkbox" id="agreeFilter" onchange="renderCurrentTab()"
                       class="w-5 h-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-400 cursor-pointer">
                <label for="agreeFilter" class="text-sm text-slate-300 cursor-pointer select-none">
                    Only when Proj + EV Edge agree with Bet Tag
                </label>
            </div>
            <div class="flex items-center gap-3">
                <input type="checkbox" id="standardOnlyFilter" onchange="renderCurrentTab()" checked
                       class="w-5 h-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-400 cursor-pointer">
                <label for="standardOnlyFilter" class="text-sm text-slate-300 cursor-pointer select-none">
                    Standard Props Only
                </label>
            </div>
            <div class="flex items-center gap-3">
                <input type="checkbox" id="hideLongshotsFilter" onchange="renderCurrentTab()" checked
                       class="w-5 h-5 rounded border-slate-600 bg-slate-900 text-emerald-400 focus:ring-emerald-400 cursor-pointer">
                <label for="hideLongshotsFilter" class="text-sm text-slate-300 cursor-pointer select-none">
                    Hide extreme longshots (+700+)
                </label>
            </div>

            <button id="bestBetsBtn" onclick="toggleBestBets()"
                    class="ml-auto px-5 py-2 rounded-3xl text-sm font-semibold border border-slate-600 bg-slate-800 hover:bg-slate-700 transition-colors">
                <i class="fa-solid fa-star mr-2"></i>Best Bets
            </button>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-700 mb-6">
            <button onclick="switchTab(0)" id="tab-0" class="tab px-8 py-4 font-semibold text-xl flex-1">TRADITIONAL</button>
            <button onclick="switchTab(1)" id="tab-1" class="tab tab-active px-8 py-4 font-semibold text-xl flex-1">DFS</button>
            <button onclick="switchTab(2)" id="tab-2" class="tab px-8 py-4 font-semibold text-xl flex-1">EXCHANGES</button>
            <button onclick="switchTab(3)" id="tab-3" class="tab px-8 py-4 font-semibold text-xl flex-1">ADVANCED</button>
        </div>

        <div id="resultCount" class="text-xs text-slate-500 mb-3"></div>

        <table class="w-full bg-slate-900 rounded-3xl overflow-hidden">
            <thead class="bg-slate-800 text-xs text-slate-400">
                <tr>
                    <th class="text-left py-5 px-6 w-96">PROP DETAILS</th>
                    <th class="text-left py-5 px-6">BOOKMAKER</th>
                    <th class="text-right py-5 px-6">OVER / UNDER</th>
                    <th class="text-right py-5 px-6" data-sort="proj" onclick="sortBy('proj')">PROJ <span class="sort-icon">↕</span></th>
                    <th class="text-right py-5 px-6" data-sort="proj_vs_line" onclick="sortBy('proj_vs_line')">PROJ vs LINE <span class="sort-icon">↕</span></th>
                    <th class="text-right py-5 px-6" data-sort="hit" onclick="sortBy('hit')">HIT % <span class="sort-icon">↕</span></th>
                    <th class="text-right py-5 px-6 sorted" data-sort="edge" onclick="sortBy('edge')">EV EDGE <span class="sort-icon">↓</span></th>
                    <th class="text-right py-5 px-6">COMPARE</th>
                </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-700 text-sm"></tbody>
        </table>
    </div>

    <script>
        let allProps = [];
        let currentTab = 1;
        let currentSort = 'edge';
        let sortDirection = -1;
        let bestBetsMode = false;
        let playerDetailChart = null;
        let gameLogData = null;
        let gameLogsLoading = false;

        window.loadGameLogs = loadGameLogs;
        window.getPlayerGameLogs = getPlayerGameLogs;
        window.showPlayerDetailModal = showPlayerDetailModal;

        function getBookmakerType(book) {
            const b = (book || '').toLowerCase();
            if (b.includes('prizepicks') || b.includes('underdog') ||
                b.includes('pick6') || b.includes('fliff') || b.includes('dabble')) return 'DFS';
            if (b.includes('pinnacle') || b.includes('prophetx') || b.includes('novig') ||
                b.includes('kalshi') || b.includes('polymarket') || b.includes('betfair')) return 'Exchange';
            return 'Traditional';
        }
        function isTraditional(book) { return getBookmakerType(book) === 'Traditional'; }
        function isDFS(book) { return getBookmakerType(book) === 'DFS'; }
        function isExchange(book) { return getBookmakerType(book) === 'Exchange'; }

        async function loadProps() {
            const status = document.getElementById('status');
            status.innerHTML = '🔄 Loading props...';
            const success = await tryLoadData();
            if (success) {
                populateFilters();
                renderCurrentTab();
            } else {
                status.innerHTML = '❌ Failed to load data.';
            }
        }

        async function tryLoadData() {
            const csvUrl = 'https://raw.githubusercontent.com/925Sports/mlb-prop-optimizer/main/data/combo_data.csv?' + Date.now();
            try {
                const res = await fetch(csvUrl);
                if (!res.ok) return false;
                const text = await res.text();
                const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: false });
                if (!parsed.data || parsed.data.length === 0) return false;

                allProps = parsed.data.map(row => {
                    const point = parseFloat(row.point);
                    const trueLine = parseFloat(row['True Point Average Line']);
                    const percentEdge = parseFloat(row['% Edge']);
                    const adjustedEdge = parseFloat(row['Adjusted % Edge']);
                    const overP = parseFloat(row['Over Price']);
                    const underP = parseFloat(row['Under Price']);
                    const betTag = (row['Bet Tag'] || '').trim();
                    const isUnder = betTag.toLowerCase() === 'under';
                    const propType = (row['Prop Type'] || '').trim();

                    return {
                        away_team: row.away_team || '',
                        home_team: row.home_team || '',
                        description: row.description || '',
                        market: row.market || '',
                        point: isNaN(point) ? null : point,
                        bookmaker: row.bookmaker || '',
                        bookmaker_logo: row['Bookmaker Logo'] || '',
                        player_image: row['Player Image'] || '',
                        match_progress: row['Match Progress'] || '',
                        venue_type: row['Venue Type'] || '',
                        bet_tag: betTag,
                        label: isUnder ? 'Under' : 'Over',
                        prop_type: propType,
                        true_point_average_line: isNaN(trueLine) ? null : trueLine,
                        true_vs_point: (isNaN(trueLine) || isNaN(point)) ? null : (trueLine - point),
                        percent_edge: isNaN(percentEdge) ? null : percentEdge,
                        adjusted_edge: isNaN(adjustedEdge) ? null : adjustedEdge,
                        over_price: isNaN(overP) ? null : overP,
                        under_price: isNaN(underP) ? null : underP,
                        over_percent: row['Over %'] || '',
                        under_percent: row['Under %'] || '',
                        no_vig_over: row['No-Vig Over %'] || '',
                        no_vig_under: row['No-Vig Under %'] || '',
                        true_price: row['True Price'] || '',
                        avg_no_vig_over: row['Average No-Vig Over %'] || '',
                        avg_no_vig_under: row['Average No-Vig Under %'] || '',
                        max_no_vig_diff: row['Max No-Vig Diff'] || '',
                        fav: row.Fav || '',
                        spread: row.Spread || '',
                        ou: row['O/U'] || ''
                    };
                }).filter(p => p.description);

                document.getElementById('status').innerHTML = `✅ Loaded ${allProps.length} props`;
                return true;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        function sortBy(column) {
            if (currentSort === column) sortDirection *= -1;
            else { currentSort = column; sortDirection = -1; }

            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.classList.remove('sorted');
                const icon = th.querySelector('.sort-icon');
                if (icon) icon.textContent = '↕';
            });
            const activeTh = document.querySelector(`th[data-sort="${column}"]`);
            if (activeTh) {
                activeTh.classList.add('sorted');
                const icon = activeTh.querySelector('.sort-icon');
                if (icon) icon.textContent = sortDirection === -1 ? '↓' : '↑';
            }
            renderCurrentTab();
        }

        function getSortValue(p, column) {
            switch (column) {
                case 'proj': return p.true_point_average_line ?? -999;
                case 'proj_vs_line': return p.true_vs_point ?? -999;
                case 'hit': return p.percent_edge ?? -999;
                case 'edge': return p.adjusted_edge ?? -999;
                default: return 0;
            }
        }

        function toggleBestBets() {
            bestBetsMode = !bestBetsMode;
            const btn = document.getElementById('bestBetsBtn');
            if (bestBetsMode) {
                btn.classList.add('best-bets-active');
                btn.innerHTML = '<i class="fa-solid fa-star mr-2"></i>Best Bets ON';
            } else {
                btn.classList.remove('best-bets-active');
                btn.innerHTML = '<i class="fa-solid fa-star mr-2"></i>Best Bets';
            }
            renderCurrentTab();
        }

        function extractPlayerName(description) {
            if (!description) return '';
            const marketKeywords = [' Hits+Runs+RBIs', ' Hits', ' Runs', ' RBIs', ' Strikeouts', ' Walks', ' Total Bases', ' Home Runs', ' Singles', ' Doubles', ' Triples', ' Pitcher Strikeouts', ' Batter Runs Scored'];
            let name = description.trim();
            for (const kw of marketKeywords) {
                if (name.includes(kw)) { name = name.split(kw)[0].trim(); break; }
            }
            return name.replace(/\s+(Jr\.|Sr\.|III|IV)$/i, '').trim();
        }

        function namesMatch(csvName, targetName, positionHint = '') {
            if (!csvName || !targetName) return false;
            const c = csvName.toString().toLowerCase().trim();
            const t = targetName.toString().toLowerCase().trim();
            if (c === t) return true;
            const tParts = t.split(/\s+/);
            const cParts = c.split(/\s+/);
            if (tParts.length >= 2 && cParts.length >= 1) {
                const tLast = tParts[tParts.length - 1];
                const cLast = cParts[cParts.length - 1];
                if (tLast === cLast) {
                    if (positionHint.toLowerCase().includes('pitch') && tParts.length >= 2 && cParts.length >= 2) {
                        return tParts[0][0] === cParts[0][0];
                    }
                    return true;
                }
            }
            if (tParts.length === 2 && cParts.length >= 2) {
                if (tParts[0][0] === cParts[0][0] && tParts[1] === cParts[cParts.length - 1]) return true;
            }
            if (c.includes(',') && tParts.length === 2) {
                const [last, first] = c.split(',').map(s => s.trim());
                if (last === tParts[1] && first[0] === tParts[0][0]) return true;
            }
            return false;
        }

        function calculatePitchingOuts(ipValue) {
            if (!ipValue) return 0;
            const ip = parseFloat(ipValue);
            if (isNaN(ip)) return 0;
            const fullInnings = Math.floor(ip);
            const decimalPart = ip - fullInnings;
            let extraOuts = 0;
            if (decimalPart >= 0.2) extraOuts = 2;
            else if (decimalPart >= 0.1) extraOuts = 1;
            return (fullInnings * 3) + extraOuts;
        }

        async function loadGameLogs() {
            if (gameLogData || gameLogsLoading) return gameLogData;
            gameLogsLoading = true;
            const statusEl = document.getElementById('status');
            const originalStatus = statusEl ? statusEl.innerHTML : '';
            if (statusEl) statusEl.innerHTML = '🔄 Loading real game logs...';

            const gameLogUrl = 'https://raw.githubusercontent.com/925Sports/mlb-player-game-logs/main/mlb_2026_season_game_logs.csv?' + Date.now();
            try {
                const res = await fetch(gameLogUrl);
                if (!res.ok) throw new Error('Failed to fetch');
                const text = await res.text();
                const parsed = Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: false });
                gameLogData = (parsed.data || []).filter(row =>
                    row.player_name || row.fullName || row.playerName || row.full_name || row.player_full_name
                );
                if (statusEl) {
                    statusEl.innerHTML = `✅ Loaded ${gameLogData.length} real game log rows`;
                    setTimeout(() => { if (statusEl && statusEl.innerHTML.includes('game log')) statusEl.innerHTML = originalStatus; }, 2200);
                }
                return gameLogData;
            } catch (e) {
                console.error(e);
                if (statusEl) {
                    statusEl.innerHTML = '⚠️ Could not load real game logs';
                    setTimeout(() => { if (statusEl) statusEl.innerHTML = originalStatus; }, 2800);
                }
                gameLogData = [];
                return gameLogData;
            } finally {
                gameLogsLoading = false;
            }
        }

        function getPlayerGameLogs(playerName, limit = 20, positionHint = '') {
            if (!gameLogData || gameLogData.length === 0) return [];
            const target = extractPlayerName(playerName);
            let filtered = gameLogData.filter(row => {
                const csvName = row.player_name || row.fullName || row.playerName || row.full_name || row.player_full_name || '';
                return namesMatch(csvName, target, positionHint);
            });
            if (positionHint.toLowerCase().includes('pitch')) {
                filtered = filtered.filter(row => {
                    const ip = parseFloat(row.innings_pitched || row.IP || row.inningsPitched || row.player_pitcher_ip || 0);
                    const k = parseFloat(row.strikeouts || row.strikeouts_pitched || row.K || row.strikeOutsPitching || 0);
                    return ip > 0 || k > 0;
                });
            }
            const seen = new Map();
            for (const row of filtered) {
                const dateKey = (row.game_date || row.date || row.gameDate || '').toString().slice(0, 10);
                if (!seen.has(dateKey)) seen.set(dateKey, row);
                else {
                    const existing = seen.get(dateKey);
                    const existingIP = parseFloat(existing.innings_pitched || existing.IP || 0);
                    const newIP = parseFloat(row.innings_pitched || row.IP || 0);
                    if (newIP > existingIP) seen.set(dateKey, row);
                }
            }
            filtered = Array.from(seen.values());
            return filtered.sort((a, b) => {
                const dA = new Date(a.game_date || a.date || a.gameDate || a.officialDate || 0);
                const dB = new Date(b.game_date || b.date || b.gameDate || b.officialDate || 0);
                return dB - dA;
            }).slice(0, limit);
        }

        function getOpponent(row) {
            if (row.opponent) return row.opponent;
            if (row.opp) return row.opp;
            if (row.opponent_abbrev) return row.opponent_abbrev;
            if (row.opp_abbrev) return row.opp_abbrev;
            const homeAbbr = row.home_team_abbrev || row.home_team_abbreviation || row.homeTeamAbbrev || row.home_team || '';
            const awayAbbr = row.away_team_abbrev || row.away_team_abbreviation || row.awayTeamAbbrev || row.away_team || '';
            const homeAway = (row.home_away || row.homeAway || row.is_home || '').toString().toLowerCase();
            if (homeAway === 'home' || homeAway === 'h' || homeAway === 'true') return awayAbbr || homeAbbr;
            if (homeAway === 'away' || homeAway === 'a' || homeAway === 'false') return homeAbbr || awayAbbr;
            const playerTeam = (row.team_abbrev || row.team || row.player_team || '').toString().toUpperCase();
            if (playerTeam && homeAbbr && awayAbbr) {
                if (playerTeam === homeAbbr.toUpperCase()) return awayAbbr;
                if (playerTeam === awayAbbr.toUpperCase()) return homeAbbr;
            }
            return awayAbbr || homeAbbr || '?';
        }

        function getStatValueForSplits(row, market = '', description = '') {
            const lowerMarket = (market || '').toLowerCase();
            const lowerDesc = (description || '').toLowerCase();
            if (lowerMarket.includes('strikeout') || lowerDesc.includes('strikeout')) {
                return parseFloat(row.strikeouts || row.strikeouts_pitched || row.K || row.strikeOutsPitching || 0);
            }
            if (lowerMarket.includes('outs') || lowerDesc.includes('outs') || lowerMarket.includes('pitching outs') || lowerDesc.includes('pitching outs')) {
                return calculatePitchingOuts(row.innings_pitched || row.IP || row.inningsPitched || row.player_pitcher_ip || 0);
            }
            if (lowerMarket.includes('runs scored') || lowerDesc.includes('runs scored') || lowerDesc.includes('batter runs')) {
                return parseFloat(row.runs || row.R || 0);
            }
            if (lowerMarket.includes('hits+runs+rbis') || lowerDesc.includes('hits+runs+rbis')) {
                const h = parseFloat(row.hits || row.H || 0);
                const r = parseFloat(row.runs || row.R || 0);
                const rbi = parseFloat(row.rbi || row.RBI || 0);
                return h + r + rbi;
            }
            if (lowerMarket.includes('hits') || lowerDesc.includes(' hits')) return parseFloat(row.hits || row.H || 0);
            if (lowerMarket.includes('rbi') || lowerDesc.includes('rbi')) return parseFloat(row.rbi || row.RBI || 0);
            if (lowerMarket.includes('home run') || lowerDesc.includes('home run')) return parseFloat(row.home_runs || row.HR || 0);
            if (lowerMarket.includes('total base') || lowerDesc.includes('total base')) {
                const h = parseFloat(row.hits || row.H || 0);
                const doubles = parseFloat(row.doubles || 0);
                const triples = parseFloat(row.triples || 0);
                const hr = parseFloat(row.home_runs || row.HR || 0);
                return h + doubles + (triples * 2) + (hr * 3);
            }
            return parseFloat(row.runs || row.R || row.hits || row.H || 0);
        }

        function populateFilters() {
            const marketSet = new Set(allProps.map(p => p.market));
            const marketSelect = document.getElementById('marketFilter');
            marketSelect.innerHTML = '<option value="">All Markets</option>';
            Array.from(marketSet).sort().forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m.replace(/_/g, ' ').toUpperCase();
                marketSelect.appendChild(opt);
            });

            const gameSet = new Set(allProps.map(p => `${p.away_team} @ ${p.home_team}`));
            const gameSelect = document.getElementById('gameFilter');
            gameSelect.innerHTML = '<option value="">All Games</option>';
            Array.from(gameSet).sort().forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                gameSelect.appendChild(opt);
            });

            let bookSet;
            if (currentTab === 0) bookSet = new Set(allProps.filter(p => isTraditional(p.bookmaker)).map(p => p.bookmaker));
            else if (currentTab === 1) bookSet = new Set(allProps.filter(p => isDFS(p.bookmaker)).map(p => p.bookmaker));
            else if (currentTab === 2) bookSet = new Set(allProps.filter(p => isExchange(p.bookmaker)).map(p => p.bookmaker));
            else bookSet = new Set(allProps.map(p => p.bookmaker));

            const bookSelect = document.getElementById('bookFilter');
            bookSelect.innerHTML = '<option value="">All Books</option>';
            Array.from(bookSet).sort().forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                bookSelect.appendChild(opt);
            });

            const progressSet = new Set(allProps.map(p => p.match_progress).filter(Boolean));
            const progressSelect = document.getElementById('matchProgressFilter');
            progressSelect.innerHTML = '<option value="">All Progress</option>';
            Array.from(progressSet).sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                progressSelect.appendChild(opt);
            });
        }

        function renderCurrentTab() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const marketFilter = document.getElementById('marketFilter').value;
            const gameFilter = document.getElementById('gameFilter').value;
            const bookFilter = document.getElementById('bookFilter').value;
            const progressFilter = document.getElementById('matchProgressFilter').value;
            const minEdge = parseFloat(document.getElementById('minEdgeFilter').value) || 0;
            const agreeFilter = document.getElementById('agreeFilter')?.checked;
            const standardOnly = document.getElementById('standardOnlyFilter')?.checked;
            const hideLongshots = document.getElementById('hideLongshotsFilter')?.checked;

            let filtered = [...allProps];

            if (currentTab === 0) filtered = filtered.filter(p => isTraditional(p.bookmaker));
            if (currentTab === 1) filtered = filtered.filter(p => isDFS(p.bookmaker));
            if (currentTab === 2) filtered = filtered.filter(p => isExchange(p.bookmaker));

            if (marketFilter) filtered = filtered.filter(p => p.market === marketFilter);
            if (gameFilter) filtered = filtered.filter(p => `${p.away_team} @ ${p.home_team}` === gameFilter);
            if (bookFilter) filtered = filtered.filter(p => p.bookmaker === bookFilter);
            if (progressFilter) filtered = filtered.filter(p => p.match_progress === progressFilter);

            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.description.toLowerCase().includes(searchTerm) ||
                    p.away_team.toLowerCase().includes(searchTerm) ||
                    p.home_team.toLowerCase().includes(searchTerm) ||
                    p.market.toLowerCase().includes(searchTerm)
                );
            }

            if (standardOnly) filtered = filtered.filter(p => p.prop_type === 'Standard');
            if (minEdge > 0) filtered = filtered.filter(p => (p.adjusted_edge || 0) >= minEdge);
            if (hideLongshots) {
                filtered = filtered.filter(p => {
                    if (p.over_price != null && p.over_price > 700) return false;
                    return true;
                });
            }

            if (agreeFilter) {
                filtered = filtered.filter(p => {
                    const isOver = (p.label === 'Over' || p.bet_tag === 'Over');
                    const projDiff = p.true_vs_point;
                    const evEdge = p.adjusted_edge;
                    if (projDiff == null || evEdge == null) return false;
                    const projAgrees = isOver ? projDiff > 0 : projDiff < 0;
                    return projAgrees && evEdge > 0;
                });
            }

            if (bestBetsMode) {
                filtered = filtered.filter(p => {
                    const isOver = (p.label === 'Over' || p.bet_tag === 'Over');
                    const projDiff = p.true_vs_point;
                    const evEdge = p.adjusted_edge;
                    if (projDiff == null || evEdge == null || evEdge <= 0) return false;
                    const projAgrees = isOver ? projDiff > 0 : projDiff < 0;
                    if (!projAgrees) return false;
                    if (Math.abs(projDiff) > 1.8) return false;
                    const isDfs = isDFS(p.bookmaker);
                    if (!isDfs && p.prop_type !== 'Standard') return false;
                    return true;
                });
            }

            filtered.sort((a, b) => {
                const valA = getSortValue(a, currentSort);
                const valB = getSortValue(b, currentSort);
                return (valB - valA) * (sortDirection === -1 ? 1 : -1);
            });

            const countEl = document.getElementById('resultCount');
            if (countEl) countEl.textContent = `Showing ${Math.min(filtered.length, 800)} of ${filtered.length} props`;

            filtered.slice(0, 800).forEach(p => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-800';

                const trueLine = p.true_point_average_line != null ? p.true_point_average_line.toFixed(2) : '-';
                const diff = p.true_vs_point;
                const diffDisplay = diff != null ? (diff > 0 ? '+' : '') + diff.toFixed(2) : '-';
                const hitProb = p.percent_edge != null ? p.percent_edge.toFixed(1) + '%' : '-';
                const adjEdge = p.adjusted_edge;
                const adjEdgeDisplay = adjEdge != null ? (adjEdge > 0 ? '+' : '') + adjEdge.toFixed(2) + '%' : '-';
                const adjEdgeColor = adjEdge > 0 ? 'text-emerald-400' : adjEdge < 0 ? 'text-rose-400' : '';
                const overUnder = (p.over_price != null || p.under_price != null) ? `${p.over_price ?? '-'} / ${p.under_price ?? '-'}` : '-';
                const isUnder = p.label === 'Under';
                const tagColorClass = isUnder ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';

                let bookmakerHTML = p.bookmaker_logo
                    ? `<div class="flex items-center gap-x-2"><img src="${p.bookmaker_logo}" class="bookmaker-logo" alt="${p.bookmaker}" onerror="this.style.display='none'"><span class="text-xs uppercase">${p.bookmaker}</span></div>`
                    : `<span class="text-xs uppercase">${p.bookmaker}</span>`;

                let extraInfo = '';
                if (p.match_progress) extraInfo += `<span class="px-2 py-0.5 text-[10px] bg-slate-700 rounded mr-1">${p.match_progress}</span>`;
                if (p.venue_type) extraInfo += `<span class="px-2 py-0.5 text-[10px] bg-slate-600 rounded">${p.venue_type}</span>`;

                const playerNameClick = `showPlayerDetailModal('${p.description.replace(/'/g, "\\'")}', '${p.market}', ${p.point}, '${p.away_team}', '${p.home_team}')`;

                row.innerHTML = `
                    <td class="px-6 py-5">
                        <div class="font-semibold text-base cursor-pointer hover:text-emerald-400 transition-colors" onclick="${playerNameClick}">${p.description}</div>
                        <div class="text-sm mt-0.5">${p.market.replace(/_/g, ' ').toUpperCase()} <span class="font-bold">${p.point ?? ''}</span></div>
                        <div class="text-xs text-slate-500 mt-1">${p.away_team} @ ${p.home_team}</div>
                        ${extraInfo ? `<div class="mt-1.5">${extraInfo}</div>` : ''}
                        <div class="mt-1"><span class="px-2.5 py-0.5 text-xs font-medium rounded-2xl ${tagColorClass}">${p.bet_tag || ''}</span></div>
                    </td>
                    <td class="px-6 py-5">${bookmakerHTML}</td>
                    <td class="px-6 py-5 text-right font-mono text-sm">${overUnder}</td>
                    <td class="px-6 py-5 text-right font-mono">${trueLine}</td>
                    <td class="px-6 py-5 text-right font-mono ${diff > 0 ? 'text-emerald-400' : diff < 0 ? 'text-rose-400' : ''}">${diffDisplay}</td>
                    <td class="px-6 py-5 text-right font-mono">${hitProb}</td>
                    <td class="px-6 py-5 text-right font-mono font-semibold ${adjEdgeColor}">${adjEdgeDisplay}</td>

                                class="px-3 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded-2xl border border-slate-600">View Books</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function switchPlayerDetailTab(tabIndex, description, market, point, away_team, home_team, isPitcherProp = false) {
            document.querySelectorAll('.detail-tab').forEach(el => el.classList.remove('active'));
            const activeTab = document.getElementById(`pdtab-${tabIndex}`);
            if (activeTab) activeTab.classList.add('active');

            const content = document.getElementById('playerDetailContent');
            if (!content) return;
            content.innerHTML = '';

            const playerName = extractPlayerName(description);
            const positionHint = isPitcherProp ? 'Pitcher' : '';
            const relatedProps = allProps.filter(p => p.description === description && p.market === market && p.point == point);
            const bestProp = relatedProps.length > 0
                ? relatedProps.reduce((best, p) => ((p.adjusted_edge || -999) > (best.adjusted_edge || -999) ? p : best), relatedProps[0])
                : null;

            // ========== SUMMARY TAB ==========
            if (tabIndex === 0) {
                content.innerHTML = `<div class="text-center py-12 text-slate-400">Loading summary...</div>`;

                if (typeof window.loadGameLogs === 'function') await window.loadGameLogs();

                const logs = getPlayerGameLogs(playerName, 20, positionHint);
                const lineValue = parseFloat(point) || 0;
                const isOver = bestProp ? (bestProp.label === 'Over' || bestProp.bet_tag === 'Over') : true;

                // Calculate hit rates from game logs
                let l5Hits = 0, l10Hits = 0, l20Hits = 0;
                let l5Total = 0, l10Total = 0, l20Total = 0;
                const values = [];

                logs.forEach((row, i) => {
                    const val = getStatValueForSplits(row, market, description);
                    values.push(val);
                    const hit = isOver ? val >= lineValue : val < lineValue;
                    if (i < 5)  { l5Total++;  if (hit) l5Hits++; }
                    if (i < 10) { l10Total++; if (hit) l10Hits++; }
                    if (i < 20) { l20Total++; if (hit) l20Hits++; }
                });

                const l5Rate  = l5Total  > 0 ? Math.round((l5Hits  / l5Total)  * 100) : null;
                const l10Rate = l10Total > 0 ? Math.round((l10Hits / l10Total) * 100) : null;
                const l20Rate = l20Total > 0 ? Math.round((l20Hits / l20Total) * 100) : null;

                const edge = bestProp?.adjusted_edge ?? null;
                const hitProb = bestProp?.percent_edge ?? null;
                const proj = bestProp?.true_point_average_line ?? null;
                const projDiff = bestProp?.true_vs_point ?? null;
                const betTag = bestProp?.bet_tag || (isOver ? 'Over' : 'Under');

                // Build verdict
                let score = 0;
                const reasons = [];

                if (edge != null) {
                    if (edge >= 8)      { score += 3; reasons.push(`Strong price edge (+${edge.toFixed(1)}%) vs market consensus`); }
                    else if (edge >= 4) { score += 2; reasons.push(`Solid price edge (+${edge.toFixed(1)}%)`); }
                    else if (edge >= 1) { score += 1; reasons.push(`Small positive edge (+${edge.toFixed(1)}%)`); }
                    else if (edge > -2) { score += 0; reasons.push(`Roughly fair price (${edge.toFixed(1)}%)`); }
                    else                { score -= 2; reasons.push(`Poor price vs market (${edge.toFixed(1)}%)`); }
                }

                if (projDiff != null) {
                    const agrees = isOver ? projDiff > 0 : projDiff < 0;
                    if (agrees && Math.abs(projDiff) >= 0.4) {
                        score += 2;
                        reasons.push(`Projection strongly favors ${betTag} (${projDiff > 0 ? '+' : ''}${projDiff.toFixed(2)} vs line)`);
                    } else if (agrees) {
                        score += 1;
                        reasons.push(`Projection mildly favors ${betTag}`);
                    } else {
                        score -= 2;
                        reasons.push(`Projection disagrees with ${betTag} side`);
                    }
                }

                if (l10Rate != null) {
                    if (l10Rate >= 70)      { score += 2; reasons.push(`Hot recent form: ${l10Rate}% hit rate over last 10 games`); }
                    else if (l10Rate >= 55) { score += 1; reasons.push(`Decent recent form: ${l10Rate}% over last 10`); }
                    else if (l10Rate >= 40) { score += 0; reasons.push(`Average recent form: ${l10Rate}% over last 10`); }
                    else                    { score -= 1; reasons.push(`Cold recent form: only ${l10Rate}% over last 10`); }
                } else {
                    reasons.push('No recent game-log data available for this player/market');
                }

                let verdict, verdictClass, verdictText;
                if (score >= 5) {
                    verdict = 'STRONG';
                    verdictClass = 'verdict-strong';
                    verdictText = 'This looks like a high-quality spot. Edge, projection, and recent form all align.';
                } else if (score >= 3) {
                    verdict = 'DECENT';
                    verdictClass = 'verdict-decent';
                    verdictText = 'Playable. Some supporting factors, but not a slam dunk.';
                } else if (score >= 1) {
                    verdict = 'WEAK';
                    verdictClass = 'verdict-weak';
                    verdictText = 'Marginal. Only consider if you have a strong opinion or extra context.';
                } else {
                    verdict = 'AVOID';
                    verdictClass = 'verdict-avoid';
                    verdictText = 'Poor setup. Price, projection, or form is working against this bet.';
                }

                content.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Verdict Card -->
                        <div class="lg:col-span-1">
                            <div class="rounded-2xl p-6 ${verdictClass}">
                                <div class="text-xs font-semibold uppercase tracking-wider opacity-80 mb-1">Verdict</div>
                                <div class="text-4xl font-bold mb-3">${verdict}</div>
                                <p class="text-sm leading-relaxed opacity-90">${verdictText}</p>
                            </div>

                            <div class="mt-4 bg-slate-800 rounded-2xl p-5 space-y-3 text-sm">
                                <div class="flex justify-between"><span class="text-slate-400">Side</span><span class="font-semibold">${betTag}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">EV Edge</span><span class="font-semibold ${edge > 0 ? 'text-emerald-400' : edge < 0 ? 'text-rose-400' : ''}">${edge != null ? (edge > 0 ? '+' : '') + edge.toFixed(2) + '%' : '—'}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Hit Probability</span><span class="font-semibold">${hitProb != null ? hitProb.toFixed(1) + '%' : '—'}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Projection</span><span class="font-semibold">${proj != null ? proj.toFixed(2) : '—'}</span></div>
                                <div class="flex justify-between"><span class="text-slate-400">Proj vs Line</span><span class="font-semibold ${projDiff > 0 ? 'text-emerald-400' : projDiff < 0 ? 'text-rose-400' : ''}">${projDiff != null ? (projDiff > 0 ? '+' : '') + projDiff.toFixed(2) : '—'}</span></div>
                            </div>
                        </div>

                        <!-- Reasons + Game Log Snapshot -->
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-slate-800 rounded-2xl p-6">
                                <div class="font-semibold mb-4">Why this rating?</div>
                                <ul class="space-y-2 text-sm">
                                    ${reasons.map(r => `<li class="flex items-start gap-2"><span class="text-emerald-400 mt-0.5">•</span><span>${r}</span></li>`).join('')}
                                </ul>
                            </div>

                            <div class="bg-slate-800 rounded-2xl p-6">
                                <div class="font-semibold mb-4">Recent Game Log vs Line (${lineValue})</div>
                                ${logs.length === 0 ? `
                                    <div class="text-slate-400 text-sm">No recent game logs found for this player.</div>
                                ` : `
                                    <div class="grid grid-cols-3 gap-4 mb-5">
                                        <div class="text-center p-3 bg-slate-900 rounded-xl">
                                            <div class="text-xs text-slate-400 mb-1">L5 Hit Rate</div>
                                            <div class="text-2xl font-bold ${l5Rate >= 60 ? 'text-emerald-400' : l5Rate < 40 ? 'text-rose-400' : ''}">${l5Rate != null ? l5Rate + '%' : '—'}</div>
                                        </div>
                                        <div class="text-center p-3 bg-slate-900 rounded-xl">
                                            <div class="text-xs text-slate-400 mb-1">L10 Hit Rate</div>
                                            <div class="text-2xl font-bold ${l10Rate >= 60 ? 'text-emerald-400' : l10Rate < 40 ? 'text-rose-400' : ''}">${l10Rate != null ? l10Rate + '%' : '—'}</div>
                                        </div>
                                        <div class="text-center p-3 bg-slate-900 rounded-xl">
                                            <div class="text-xs text-slate-400 mb-1">L20 Hit Rate</div>
                                            <div class="text-2xl font-bold ${l20Rate >= 60 ? 'text-emerald-400' : l20Rate < 40 ? 'text-rose-400' : ''}">${l20Rate != null ? l20Rate + '%' : '—'}</div>
                                        </div>
                                    </div>
                                    <div class="text-xs text-slate-500">
                                        Hit = finished ${isOver ? 'at or above' : 'below'} the line of ${lineValue} in that game.
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }
            // ========== OVERVIEW TAB ==========
            else if (tabIndex === 1) {
                const bestEdge = relatedProps.length > 0 ? Math.max(...relatedProps.map(p => p.adjusted_edge || 0)) : 0;
                const proj = relatedProps.length > 0 && relatedProps[0].true_point_average_line != null ? relatedProps[0].true_point_average_line.toFixed(2) : '-';
                const diff = relatedProps.length > 0 && relatedProps[0].true_vs_point != null ? relatedProps[0].true_vs_point.toFixed(2) : '-';
                const hitProb = relatedProps.length > 0 && relatedProps[0].percent_edge != null ? relatedProps[0].percent_edge.toFixed(1) + '%' : '-';

                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 bg-slate-800 rounded-2xl p-6">
                            <div class="text-sm text-slate-400 mb-1">BEST EV EDGE</div>
                            <div class="text-5xl font-semibold ${bestEdge > 0 ? 'text-emerald-400' : 'text-rose-400'}">${bestEdge > 0 ? '+' : ''}${bestEdge.toFixed(1)}%</div>
                            <div class="mt-4 text-sm">
                                <div class="flex justify-between py-1 border-b border-slate-700"><span class="text-slate-400">Projection</span> <span class="font-mono">${proj}</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-700"><span class="text-slate-400">Proj vs Line</span> <span class="font-mono">${diff}</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-700"><span class="text-slate-400">Hit Probability</span> <span class="font-mono">${hitProb}</span></div>
                                <div class="flex justify-between py-1"><span class="text-slate-400">Books Available</span> <span class="font-semibold">${relatedProps.length}</span></div>
                            </div>
                            <div class="mt-6">
                                <button onclick="showComparisonModalFromList(null, '${away_team}|${home_team}|${description}|${market}|${point}'); document.getElementById('playerDetailPopup').remove();"
                                        class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 rounded-3xl font-semibold flex items-center justify-center gap-x-2">
                                    <i class="fa-solid fa-exchange-alt"></i> Compare All Books
                                </button>
                            </div>
                        </div>
                        <div class="bg-slate-800 rounded-2xl p-6 text-sm">
                            <div class="font-semibold mb-3">Quick Insights for ${playerName}</div>
                            <div class="space-y-3 text-slate-300">
                                <div class="flex items-start gap-3"><i class="fa-solid fa-info-circle mt-1 text-emerald-400"></i> <span>Sorted by EV Edge (Adjusted % Edge vs market).</span></div>
                                <div class="flex items-start gap-3"><i class="fa-solid fa-database mt-1 text-emerald-400"></i> <span>Game Log + Splits support Pitching Outs calculated from IP.</span></div>
                            </div>
                        </div>
                    </div>
                `;
            }
            // ========== GAME LOG TAB ==========
            else if (tabIndex === 2) {
                content.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <div class="font-semibold">Recent Game Log for ${playerName}</div>
                                <div class="text-xs text-slate-400">Real data • mlb-player-game-logs repo</div>
                            </div>
                            <input id="gameLogFilter" placeholder="Filter by opponent..." class="bg-slate-800 border border-slate-700 rounded-2xl px-4 py-1.5 text-sm w-64" oninput="filterGameLogTable()">
                        </div>
                        <div class="overflow-auto max-h-[420px] border border-slate-700 rounded-2xl">
                            <table class="game-log-table w-full text-sm">
                                <thead>
                                    <tr class="text-slate-400">
                                        <th class="text-left">Date</th><th>Opp</th><th>AB/IP</th><th>Outs</th><th>H</th><th>R</th><th>RBI</th><th>HR</th><th>K</th><th>BB</th><th class="text-left">Summary</th>
                                    </tr>
                                </thead>
                                <tbody id="gameLogBody"></tbody>
                            </table>
                        </div>
                    </div>
                `;
                await renderRealGameLogTable(description, positionHint);
            }
            // ========== SPLITS TAB ==========
            else if (tabIndex === 3) {
                content.innerHTML = `
                    <div>
                        <div class="font-semibold mb-1">Performance vs Line — ${market.replace(/_/g, ' ')} @ ${point}</div>
                        <div class="text-xs text-slate-400 mb-4">Player: ${playerName}</div>
                        <div class="splits-chart-container bg-slate-800 rounded-2xl p-4" style="height: 260px;">
                            <canvas id="splitsChart"></canvas>
                        </div>
                        <div class="flex justify-center gap-x-8 mt-4 text-sm">
                            <div><span class="text-emerald-400 font-semibold">L5 Hit Rate:</span> <span id="l5Rate">—</span></div>
                            <div><span class="text-emerald-400 font-semibold">L10 Hit Rate:</span> <span id="l10Rate">—</span></div>
                            <div><span class="text-emerald-400 font-semibold">L20 Hit Rate:</span> <span id="l20Rate">—</span></div>
                        </div>
                    </div>
                `;
                setTimeout(() => renderRealSplitsChart(description, point, market, positionHint), 80);
            }
            // ========== MATCHUP TAB ==========
            else if (tabIndex === 4) {
                content.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-solid fa-shield-alt text-4xl text-slate-600 mb-4"></i>
                        <div class="text-xl font-semibold">Matchup Analysis for ${playerName}</div>
                        <div class="text-slate-400 mt-2 max-w-md mx-auto">Coming soon.</div>
                    </div>
                `;
            }
        }

        async function renderRealGameLogTable(description, positionHint = '') {
            const tbody = document.getElementById('gameLogBody');
            if (!tbody) return;
            if (typeof window.loadGameLogs === 'function') await window.loadGameLogs();
            const playerName = extractPlayerName(description);
            const logs = getPlayerGameLogs(playerName, 20, positionHint);

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="py-8 text-center text-slate-400">No recent game logs found for <strong>${playerName}</strong>.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            logs.forEach(row => {
                const date = (row.game_date || row.date || row.gameDate || '').toString().slice(0, 10);
                const opp = getOpponent(row);
                const abip = row.at_bats || row.plateAppearances || row.innings_pitched || row.IP || row.inningsPitched || row.player_pitcher_ip || '';
                const outs = calculatePitchingOuts(row.innings_pitched || row.IP || row.inningsPitched || row.player_pitcher_ip);
                const h = row.hits || row.hitsAllowed || row.H || '';
                const r = row.runs || row.runsAllowed || row.R || '';
                const rbi = row.rbi || row.RBI || '';
                const hr = row.home_runs || row.homeRunsAllowed || row.HR || '';
                const k = row.strikeouts || row.strikeouts_pitched || row.K || row.strikeOutsPitching || '';
                const bb = row.baseOnBalls || row.walks || row.baseOnBallsPitching || row.BB || '';
                const summary = row.performance || row.gameLogSummary || row.note || row.line_score || row.player_game_log || '';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800 border-b border-slate-700';
                tr.innerHTML = `
                    <td class="text-left font-mono text-xs">${date}</td>
                    <td class="font-semibold">${opp}</td>
                    <td>${abip}</td>
                    <td class="font-semibold text-emerald-400">${outs > 0 ? outs : ''}</td>
                    <td>${h}</td><td>${r}</td><td>${rbi}</td>
                    <td class="${hr > 0 ? 'text-emerald-400 font-bold' : ''}">${hr}</td>
                    <td class="${parseFloat(k) > 5 ? 'text-emerald-400 font-semibold' : ''}">${k}</td>
                    <td>${bb}</td>
                    <td class="text-left text-xs text-slate-300">${summary}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterGameLogTable() {
            const filter = document.getElementById('gameLogFilter').value.toUpperCase();
            document.querySelectorAll('#gameLogBody tr').forEach(row => {
                const opp = row.cells[1] ? row.cells[1].textContent.toUpperCase() : '';
                row.style.display = opp.includes(filter) ? '' : 'none';
            });
        }

        async function renderRealSplitsChart(description, point, market = '', positionHint = '') {
            const canvas = document.getElementById('splitsChart');
            if (!canvas) return;
            if (playerDetailChart) { playerDetailChart.destroy(); playerDetailChart = null; }
            if (typeof window.loadGameLogs === 'function') await window.loadGameLogs();

            const playerName = extractPlayerName(description);
            const logs = getPlayerGameLogs(playerName, 20, positionHint);
            const lineValue = parseFloat(point) || 2.5;

            let labels = [], data = [];
            const hasReal = logs.length > 0;

            if (hasReal) {
                logs.forEach((row, i) => {
                    const d = (row.game_date || row.date || row.gameDate || '').toString().slice(5, 10);
                    labels.push(d || `G${i + 1}`);
                    data.push(getStatValueForSplits(row, market, description));
                });
            } else {
                labels = Array.from({ length: 20 }, (_, i) => `G${i + 1}`);
                data = [2.8, 1.0, 2.8, 0, 0, 0, 2.8, 1.0, 1.0, 1.0, 2.8, 3.0, 1.0, 1.0, 4.0, 2.8, 3.0, 1.0, 2.8, 1.0];
            }

            const ctx = canvas.getContext('2d');
            const datasets = [{
                label: market ? market.replace(/_/g, ' ') : 'Stat vs Line',
                data: data,
                backgroundColor: data.map(v => v >= lineValue ? '#22c55e' : '#ef4444'),
                borderColor: '#111827',
                borderWidth: 1,
                borderRadius: 4,
                order: 2
            }];
            if (data.length > 0) {
                datasets.push({
                    label: `Line @ ${lineValue}`,
                    data: Array(data.length).fill(lineValue),
                    type: 'line',
                    borderColor: '#f59e0b',
                    borderWidth: 2,
                    borderDash: [4, 2],
                    pointRadius: 0,
                    fill: false,
                    order: 1
                });
            }

            playerDetailChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'top' } },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#64748b', font: { size: 10 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#64748b', font: { size: 10 } }, suggestedMin: 0, suggestedMax: Math.max(...data, lineValue) + 1 }
                    }
                }
            });

            const hitRate = hasReal && data.length > 0
                ? Math.round((data.filter(v => v >= lineValue).length / data.length) * 100) + '%'
                : '—';
            const l5 = document.getElementById('l5Rate');
            const l10 = document.getElementById('l10Rate');
            const l20 = document.getElementById('l20Rate');
            if (l5) l5.textContent = hasReal ? hitRate : '—';
            if (l10) l10.textContent = hasReal ? hitRate : '—';
            if (l20) l20.textContent = hasReal ? hitRate : '—';
        }

        window.onload = () => {
            document.getElementById('tab-1').classList.add('tab-active');
            loadProps();
        };
    </script>
</body>
</html>
